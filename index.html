<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fruit Rush</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <span id="hud-score">Score: 0</span>
        <span id="hud-combo">Combo: —</span>
        <span id="hud-lives">♥♥♥</span>
        <span id="hud-best">Best: 0</span>
        <button id="settings-toggle" type="button" aria-expanded="false">Settings</button>
      </header>
      <main id="stage-wrap">
        <div id="stage" aria-label="Fruit Rush game canvas"></div>
        <aside id="settings-panel" hidden></aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
